<div class="permission-matrix"><table><thead><tr><th>Model</th><th>View</th><th>Add</th><th>Change</th><th>Delete</th></tr></thead><tbody>{% for row in rows %}<tr><td>{{ row.name }}</td>{% for item in row.cells %}<td>{% if item %}<input type="checkbox" name="{{ field_name }}" value="{{ item.pk }}" aria-label="{{ item.name }}" {% if item.selected %}checked{% endif %}>{% else %}—{% endif %}</td>{% endfor %}</tr>{% if row.custom %}<tr><td colspan="5">{% for item in row.custom %}<label><input type="checkbox" name="{{ field_name }}" value="{{ item.pk }}" {% if item.selected %}checked{% endif %}>{{ item.name }}</label>{% endfor %}</td></tr>{% endif %}{% endfor %}</tbody></table></div>
