{% load ui %}<header class="app-header"><button type="button" id="sidebar-toggle" class="icon-button" aria-label="Toggle navigation" aria-expanded="true">☰</button><div class="header-context">Workspace <span>/</span> <strong>{{ module|default:'Overview' }}</strong></div><div class="header-right"><span class="timezone">Africa / Dar es Salaam</span><button type="button" class="icon-button theme-toggle" aria-label="Toggle dark theme">☾</button><span class="header-divider"></span><details class="account-dropdown"><summary><span class="avatar">{{ request.user|initials }}</span><span class="account-name">{{ request.user.get_full_name|default:request.user.username }}</span><span>⌄</span></summary><div class="dropdown-menu"><strong>{{ request.user.username }}</strong><p>{{ request.user.email }}</p><a href="{% url 'api:profile' %}">My profile</a><a href="{% url 'api:password' %}">Change password</a><form method="post" action="{% url 'api:logout' %}">{% csrf_token %}<button type="submit">Sign out ↗</button></form></div></details></div></header>
