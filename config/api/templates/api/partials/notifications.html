{% load ui %}<details class="notification-center" data-user="{{ request.user.pk }}">
<summary class="icon-button notification-toggle" aria-label="Notifications" aria-controls="notification-panel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9Z"/><path d="M10 21h4"/></svg><span class="notification-count" hidden></span></summary>
<section id="notification-panel" class="notification-panel" aria-label="Notifications"><div class="notification-heading"><div><h2>Notifications</h2><p>Updates and items that need your attention</p></div><button type="button" class="notification-close icon-button" aria-label="Close notifications">×</button></div><div class="notification-toolbar"><span data-notification-status>Workspace updates</span><button type="button" data-notifications-read>Mark all as read</button></div><div class="notification-list"><div id="configuration-notifications">{% configuration_notifications %}</div><div id="activity-notifications">{% for message in messages %}<article class="notification-item" data-notification-key="message-{{ message }}"><span class="notification-symbol info">i</span><div><strong>Workspace update</strong><p>{{ message }}</p></div></article>{% endfor %}</div><div class="notification-empty" hidden><span>✓</span><h3>You’re all caught up</h3><p>No updates need your attention right now.</p></div></div></section></details>
