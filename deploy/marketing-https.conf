server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name marketing.britishschool.ac.tz;
    ssl_certificate /etc/letsencrypt/live/marketing.britishschool.ac.tz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/marketing.britishschool.ac.tz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 8m;
    access_log /var/log/nginx/marketing.access.log;
    error_log /var/log/nginx/marketing.error.log;
    location /static/ {
        alias /var/www/marketing/static/;
        expires 7d;
        add_header X-Content-Type-Options nosniff;
    }
    location / {
        proxy_pass http://127.0.0.1:8117;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
